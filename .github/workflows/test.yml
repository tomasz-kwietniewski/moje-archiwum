name: Testy wtyczki
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: 1
      - run: npm run test:e2e
      # The Android app ships its own copy of the extraction script; it must match src/capture.js.
      - run: npm run test:android-asset
      # Android naming rules against the shared vectors (plain javac, no Android SDK).
      - run: npm run test:android-logic
      - name: Build Windows helper
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /out:native\MojeArchiwumHost.exe /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll native\Program.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run test:native
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-clipper
          path: dist/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug
